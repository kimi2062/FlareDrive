<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Titan Drive</title>
    
    <style>
      body { background-color: #0b0c10 !important; font-family: -apple-system, BlinkMacSystemFont, sans-serif !important; color: #f1f2f6 !important; margin: 0; min-height: 100vh; }
      #root-override { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
      .header { display: flex; justify-content: space-between; border-bottom: 1px solid #222533; padding-bottom: 15px; margin-bottom: 25px; }
      .logo { font-size: 22px; font-weight: 700; color: #3b82f6; }
      .upload-panel { background: #14161f; border: 2px dashed #222533; border-radius: 12px; padding: 25px; text-align: center; margin-bottom: 25px; cursor: pointer; transition: 0.2s; }
      .upload-panel:hover { border-color: #3b82f6; background: #171a26; }
      .progress-container { margin-top: 15px; background: #0b0c10; padding: 12px; border-radius: 8px; display: none; text-align: left; border: 1px solid #222533; }
      .progress-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
      .speed-tag { color: #10b981; font-weight: 600; }
      .progress-bar-bg { width: 100%; height: 6px; background: #222533; border-radius: 3px; overflow: hidden; }
      .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(to right, #3b82f6, #10b981); }
      .file-table { width: 100%; border-collapse: collapse; background: #14161f; border-radius: 12px; overflow: hidden; }
      .file-table th { background: #1c1e29; padding: 14px 20px; text-align: left; font-size: 13px; color: #7f8c8d; }
      .file-table td { padding: 16px 20px; border-bottom: 1px solid #222533; font-size: 14px; }
      .file-row:hover { background: rgba(255, 255, 255, 0.02); }
      .lock-btn { background: none!important; border: none!important; cursor: pointer; font-size: 18px; padding: 5px; }
      .locked-state { filter: drop-shadow(0 0 4px #ef4444); }
      .action-btn { background: #222533!important; color: #fff!important; border: none!important; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
      .action-btn:hover { background: #3b82f6!important; }
      .delete-btn { background: #222533!important; color: #ef4444!important; border: none!important; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
      .delete-btn:hover { background: #ef4444!important; color: #fff!important; }
      .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; transition: 0.2s; }
      .modal.active { opacity: 1; pointer-events: auto; }
      .modal-box { background: #14161f; border: 1px solid #222533; border-radius: 12px; padding: 25px; width: 90%; max-width: 450px; }
      .modal-box.large { max-width: 750px; }
      .m-input { width: 100%; background: #0b0c10; border: 1px solid #222533; color: #fff; padding: 10px; border-radius: 6px; margin: 15px 0; box-sizing: border-box; }
      .preview-area img, .preview-area video { max-width: 100%; max-height: 60vh; border-radius: 6px; }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root-override">
      <div class="header">
        <div class="logo">📂 Titan Drive</div>
        <div style="color:#7f8c8d">安全列表云网盘</div>
      </div>
      
      <div class="upload-panel" onclick="document.getElementById('hidden-file-input').click()">
        <input type="file" id="hidden-file-input" style="display:none;" onchange="window.handleUpload(this.files)" />
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 5px;">⚡ 极速云端直传</div>
        <div style="font-size: 13px; color: #7f8c8d;">点击或拖拽文件到此区域进行上传，实时显示传输速度</div>
        
        <div id="upload-progress-panel" class="progress-container" onclick="event.stopPropagation()">
          <div class="progress-meta">
            <span id="upload-filename-tag" style="font-weight:500;">拉取就绪...</span>
            <div>
              <span id="upload-percent-tag">0%</span>
              <span class="speed-tag" id="upload-speed-tag" style="margin-left:12px;">0 MB/s</span>
            </div>
          </div>
          <div class="progress-bar-bg"><div id="upload-bar-fill" class="progress-bar-fill" style="width:0%;"></div></div>
        </div>
      </div>
      
      <table class="file-table">
        <thead>
          <tr>
            <th>文件名</th>
            <th>大小</th>
            <th style="width: 80px; text-align:center;">状态</th>
            <th style="width: 240px; text-align:right;">操作</th>
          </tr>
        </thead>
        <tbody id="files-box"></tbody>
      </table>
    </div>

    <div id="lock-modal" class="modal">
      <div class="modal-box">
        <h3 id="m-title" style="margin:0;">权限安全拦截</h3>
        <input type="password" id="m-pwd" class="m-input" placeholder="请输入特定管理密码访问..." />
        <div style="text-align:right;">
          <button class="action-btn" onclick="closeBox()">取消</button>
          <button class="action-btn" style="background:#3b82f6!important" id="m-ok">核验密码</button>
        </div>
      </div>
    </div>

    <div id="view-modal" class="modal" onclick="closeView()">
      <div class="modal-box large" onclick="event.stopPropagation()">
        <h3 id="v-title" style="margin:0 0 15px 0;">文件在线预览</h3>
        <div class="preview-area" id="v-area" style="text-align:center;"></div>
      </div>
    </div>

    <div id="root" style="display:none !important;"></div>

    <script>
      (function() {
        const SEC_KEY = "aWtpbWk1MjA="; 
        let locks = JSON.parse(localStorage.getItem('hd_locks') || '{}');
        
        let files = [
          { id: '1', name: '高清航拍夜景纪实.mp4', size: '45.2 MB', type: 'video', url: 'https://w3schools.com' },
          { id: '2', name: '全景太空壁纸.jpg', size: '1.8 MB', type: 'image', url: 'https://unsplash.com' },
          { id: '3', name: '项目机密数据库说明.pdf', size: '512 KB', type: 'doc', url: '#' }
        ];
        let activeId = null, action = '';

        function drawList() {
          let box = document.getElementById('files-box'); if (!box) return; box.innerHTML = '';
          files.forEach(f => {
            let hasLock = !!locks[f.id];
            let tr = document.createElement('tr'); tr.className = 'file-row';
            tr.innerHTML = `
              <td>${f.type==='video'?'🎬':(f.type==='image'?'🖼️':'📄')} ${f.name}</td>
              <td style="color:#7f8c8d">${f.size}</td>
              <td style="text-align:center">
                <button class="lock-btn" onclick="window.onLockClick('${f.id}')">
                  <span class="${hasLock?'locked-state':''}">${hasLock?'🔴':'🔓'}</span>
                </button>
              </td>
              <td style="text-align:right">
                <button class="action-btn" onclick="window.onPreviewClick('${f.id}')">预览</button>
                <button class="action-btn" onclick="window.onDownloadClick('${f.id}')">下载</button>
                <button class="delete-btn" onclick="window.onDeleteClick('${f.id}')">删除 🗑️</button>
              </td>
            `;
            box.appendChild(tr);
          });
        }

        window.onLockClick = function(id) {
          if (!locks[id]) {
            locks[id] = true;
            localStorage.setItem('hd_locks', JSON.stringify(locks));
            alert('🔒 文件已一键加锁，状态切换为红点 🔴 拦截访问模式');
            drawList();
          } else {
            openGate(id, 'unlock', '🔓 解除文件加密：请输入专属指令');
          }
        };

        window.onPreviewClick = function(id) {
          if(locks[id]) openGate(id, 'preview', '👁️ 预览受限：请输入专属指令');
          else showPreview(id);
        };

        window.onDownloadClick = function(id) {
          if(locks[id]) openGate(id, 'download', '📥 下载受限：请输入专属指令');
          else alert('安全信道校验通过，正在下载...');
        };

        window.onDeleteClick = function(id) {
          if(locks[id]) openGate(id, 'delete', '🗑️ 危险操作：删除加锁文件需要验证密码');
          else executeDelete(id);
        };

        function openGate(id, type, title) {
          activeId = id; action = type;
          document.getElementById('m-pwd').value = '';
          document.getElementById('m-title').innerText = title;
          document.getElementById('lock-modal').classList.add('active');
        }

        document.getElementById('m-ok').addEventListener('click', () => {
          let input = document.getElementById('m-pwd').value;
          if(btoa(input) !== SEC_KEY) return alert('🚨 核心鉴权失败：密码不正确！');
          
          if(action === 'unlock') { delete locks[activeId]; alert('🔓 解密成功，文件恢复公开状态'); localStorage.setItem('hd_locks', JSON.stringify(locks)); }
          else if(action === 'preview') showPreview(activeId);
          else if(action === 'download') alert('核验成功，开始下载文件...');
          else if(action === 'delete') executeDelete(activeId);
          
          closeBox(); drawList();
        });

        function executeDelete(id) {
          let f = files.find(item => item.id === id);
          if (confirm(`确定要彻底删除文件【${f.name}】吗？`)) {
            files = files.filter(item => item.id !== id);
            if(locks[id]) delete locks[id];
            localStorage.setItem('hd_locks', JSON.stringify(locks));
            alert('文件已安全销毁');
            drawList();
          }
        }

        window.handleUpload = function(uploadedFiles) {
          if (!uploadedFiles || uploadedFiles.length === 0) return;
          let file = uploadedFiles;
          let panel = document.getElementById('upload-progress-panel');
          let bar = document.getElementById('upload-bar-fill');
panel.style.display = 'block';
document.getElementById('upload-filename-tag').innerText = 直传中: ${file.name};
let uploaded = 0, total = file.size, lastTime = Date.now(), lastLoaded = 0;
let timer = setInterval(() => {
uploaded += Math.random() * 8000000 + 4000000;
if(uploaded >= total) uploaded = total;
let now = Date.now(), duration = (now - lastTime) / 1000;
let speed = (((uploaded - lastLoaded) / duration) / (1024 * 1024)).toFixed(2);
let pct = Math.round((uploaded / total) * 100);
document.getElementById('upload-percent-tag').innerText = ${pct}%;
document.getElementById('upload-speed-tag').innerText = ${speed} MB/s;
bar.style.width = ${pct}%;
lastTime = now; lastLoaded = uploaded;
if(uploaded >= total) {
clearInterval(timer);
setTimeout(() => {
let sizeText = total > 1024 * 1024 ? ${(total/(1024*1024)).toFixed(1)} MB : ${Math.round(total/1024)} KB;
let ext = file.name.substring(file.name.lastIndexOf('.') + 1).toLowerCase();
let fType = ['png','jpg','jpeg','gif'].includes(ext) ? 'image' : (['mp4','mkv','webm'].includes(ext) ? 'video' : 'doc');
files.unshift({ id: String(Date.now()), name: file.name, size: sizeText, type: fType, url: fType==='image'?'unsplash.com' });
alert('🎉 文件成功上载至 Cloudflare R2 节点'); panel.style.display = 'none'; bar.style.width = '0%'; drawList();
}, 400);
}
}, 200);
};
function showPreview(id) {
let f = files.find(item => item.id === id); let area = document.getElementById('v-area');
document.getElementById('v-title').innerText = f.name;
if(f.type === 'image') area.innerHTML = <img src="${f.url}">;
else if(f.type === 'video') area.innerHTML = <video src="${f.url}" controls autoplay></video>;
else area.innerHTML = <p style="color:#7f8c8d;padding:20px;">该格式无法直接预览，请直接下载。</p>;
document.getElementById('view-modal').classList.add('active');
}
window.closeBox = function() { document.getElementById('lock-modal').classList.remove('active'); };
window.closeView = function() { document.getElementById('view-modal').classList.remove('active'); };
setInterval(() => { let b = document.getElementById('files-box'); if(b && b.children.length === 0) drawList(); }, 400);
})();
