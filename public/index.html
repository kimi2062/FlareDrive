<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Titan Drive</title>
    
    <style>
      body { background-color: #0b0c10 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; color: #f1f2f6 !important; margin: 0; min-height: 100vh; }
      #root-override { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
      .header { display: flex; justify-content: space-between; border-bottom: 1px solid #222533; padding-bottom: 15px; margin-bottom: 25px; align-items: center; }
      .logo { font-size: 22px; font-weight: 700; color: #3b82f6; }
      .header-actions { display: flex; align-items: center; gap: 12px; }
      .user-status { font-size: 13px; color: #7f8c8d; }
      
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #14161f; padding: 12px 18px; border-radius: 10px; border: 1px solid #222533; }
      .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
      .crumb-item { color: #3b82f6; cursor: pointer; text-decoration: none; }
      .crumb-item:hover { text-decoration: underline; }
      .crumb-sep { color: #7f8c8d; }
      .tool-actions { display: flex; gap: 10px; }
      
      .ctrl-btn { background: #222533; color: #fff; border: 1px solid #2e3446; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
      .ctrl-btn:hover { background: #3b82f6; border-color: #3b82f6; }
      .ctrl-btn.danger { background: #222533; color: #ef4444; border-color: #4b2328; }
      .ctrl-btn.danger:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

      .upload-panel { background: #14161f; border: 2px dashed #222533; border-radius: 12px; padding: 22px; text-align: center; margin-bottom: 20px; cursor: pointer; transition: 0.2s; display: block; }
      .upload-panel:hover { border-color: #3b82f6; background: #171a26; }
      .progress-container { margin-top: 15px; background: #0b0c10; padding: 12px; border-radius: 8px; display: none; text-align: left; border: 1px solid #222533; }
      .progress-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
      .speed-tag { color: #10b981; font-weight: 600; }
      .progress-bar-bg { width: 100%; height: 6px; background: #222533; border-radius: 3px; overflow: hidden; }
      .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(to right, #3b82f6, #10b981); transition: width 0.1s linear; }
      
      .file-table { width: 100%; border-collapse: collapse; background: #14161f; border-radius: 12px; overflow: hidden; }
      .file-table th { background: #1c1e29; padding: 14px 20px; text-align: left; font-size: 13px; color: #7f8c8d; }
      .file-table td { padding: 14px 20px; border-bottom: 1px solid #222533; font-size: 14px; }
      .file-row:hover { background: rgba(255, 255, 255, 0.02); }
      
      .dir-link { color: #f1f2f6; cursor: pointer; font-weight: 500; text-decoration: none; }
      .dir-link:hover { color: #3b82f6; }
      
      .lock-btn { background: none !important; border: none !important; cursor: pointer; font-size: 17px; padding: 4px; }
      .action-btn { background: #222533 !important; color: #fff !important; border: none !important; padding: 5px 10px; border-radius: 6px; cursor: pointer; margin-left: 4px; font-size: 12.5px; }
      .action-btn:hover { background: #3b82f6 !important; }
      .delete-btn { background: #222533 !important; color: #ef4444 !important; border: none !important; padding: 5px 10px; border-radius: 6px; cursor: pointer; margin-left: 4px; font-size: 12.5px; }
      .delete-btn:hover { background: #ef4444 !important; color: #fff !important; }
      
      .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; transition: 0.2s; }
      .modal.active { opacity: 1; pointer-events: auto; }
      .modal-box { background: #14161f; border: 1px solid #222533; border-radius: 12px; padding: 25px; width: 90%; max-width: 450px; }
      .modal-box.large { max-width: 800px; }
      .m-input { width: 100%; background: #0b0c10; border: 1px solid #222533; color: #fff; padding: 10px; border-radius: 6px; margin: 15px 0; box-sizing: border-box; font-size: 14px; }
      .preview-area img, .preview-area video { max-width: 100%; max-height: 65vh; border-radius: 6px; }
    </style>
  </head>

  <body>
    <div id="root-override">
      <div class="header">
        <div class="logo">📂 Titan Drive</div>
        <div class="header-actions">
          <span class="user-status" id="login-status-label">状态：访客受限模式</span>
          <button class="ctrl-btn" id="auth-btn" onclick="handleAuthBtnClick()">🔑 管理员登录</button>
        </div>
      </div>
      
      <div class="toolbar">
        <div class="breadcrumbs" id="breadcrumb-box">
          <span class="crumb-item" onclick="navigateTo('/')">根目录</span>
        </div>
        <div class="tool-actions">
          <button class="ctrl-btn" onclick="openNewFolderModal()">📁 新建文件夹</button>
          <button class="ctrl-btn" onclick="document.getElementById('hidden-folder-input').click()">📦 上传文件夹</button>
        </div>
      </div>

      <label class="upload-panel" for="hidden-file-input">
        <input type="file" id="hidden-file-input" style="display:none;" multiple onclick="event.stopPropagation()" onchange="handleFilesUpload(this.files); this.value='';" />
        <input type="file" id="hidden-folder-input" style="display:none;" webkitdirectory directory multiple onclick="event.stopPropagation()" onchange="handleFolderUpload(this.files); this.value='';" />
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">⚡ 点击选择或拖拽文件直传至当前目录</div>
        <div style="font-size: 12.5px; color: #7f8c8d;">支持批量文件、整包目录结构无损同步上载</div>
        
        <div id="upload-progress-panel" class="progress-container" onclick="event.stopPropagation()">
          <div class="progress-meta">
            <span id="upload-filename-tag">准备传输...</span>
            <div>
              <span id="upload-percent-tag">0%</span>
              <span class="speed-tag" id="upload-speed-tag" style="margin-left:12px;">0 MB/s</span>
            </div>
          </div>
          <div class="progress-bar-bg"><div id="upload-bar-fill" class="progress-bar-fill"></div></div>
        </div>
      </label>

      <table class="file-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>大小</th>
            <th style="width: 70px; text-align:center;">状态</th>
            <th style="width: 280px; text-align:right;">操作</th>
          </tr>
        </thead>
        <tbody id="files-box">
          <tr><td colspan="4" style="text-align:center;color:#7f8c8d;padding:25px;">正在加载目录...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="lock-modal" class="modal">
      <div class="modal-box">
        <h3 id="m-title" style="margin:0;">权限安全拦截</h3>
        <input type="password" id="m-pwd" class="m-input" placeholder="请输入管理密码..." />
        <div style="text-align:right;">
          <button class="action-btn" onclick="closeBox('lock-modal')">取消</button>
          <button class="action-btn" style="background:#3b82f6 !important" id="m-ok">确认验证</button>
        </div>
      </div>
    </div>

    <div id="folder-modal" class="modal">
      <div class="modal-box">
        <h3 style="margin:0;">新建文件夹</h3>
        <input type="text" id="new-folder-name" class="m-input" placeholder="请输入文件夹名称（如：资料备份）" />
        <div style="text-align:right;">
          <button class="action-btn" onclick="closeBox('folder-modal')">取消</button>
          <button class="action-btn" style="background:#3b82f6 !important" onclick="submitNewFolder()">确认创建</button>
        </div>
      </div>
    </div>

    <div id="move-modal" class="modal">
      <div class="modal-box">
        <h3 style="margin:0;">移动至目标路径</h3>
        <p style="font-size:12px;color:#7f8c8d;margin:8px 0 0 0;">输入目标目录路径，以 / 结尾（例：/文档/ 或 /）</p>
        <input type="text" id="move-dest-input" class="m-input" placeholder="/" />
        <div style="text-align:right;">
          <button class="action-btn" onclick="closeBox('move-modal')">取消</button>
          <button class="action-btn" style="background:#3b82f6 !important" onclick="submitMove()">执行移动</button>
        </div>
      </div>
    </div>

    <div id="view-modal" class="modal" onclick="closeBox('view-modal')">
      <div class="modal-box large" onclick="event.stopPropagation()">
        <h3 id="v-title" style="margin:0 0 15px 0;">文件在线预览</h3>
        <div class="preview-area" id="v-area" style="text-align:center;"></div>
      </div>
    </div>
    <script>
      (function() {
        const SEC_KEY = "aWtpbWk1MjA=";
        const LOCKS_FILE_PATH = "/webdav/.titan_locks.json";
        const SESSION_AUTH_KEY = "titan_drive_is_admin";

        let cloudLocks = {};
        let currentPath = "/";
        let files = [];
        let currentAuthAction = null;
        let movingTargetItem = null;

        async function fetchCloudLocks() {
          try {
            const res = await fetch(LOCKS_FILE_PATH);
            if (res.ok) {
              cloudLocks = await res.json();
            } else {
              cloudLocks = {};
            }
          } catch (e) {
            cloudLocks = {};
          }
        }

        async function syncCloudLocks() {
          try {
            await fetch(LOCKS_FILE_PATH, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(cloudLocks)
            });
          } catch (e) {
            console.error(e);
          }
        }

        function isAdminLoggedIn() {
          return sessionStorage.getItem(SESSION_AUTH_KEY) === "true";
        }

        function updateAuthUI() {
          const statusLabel = document.getElementById('login-status-label');
          const authBtn = document.getElementById('auth-btn');
          if (isAdminLoggedIn()) {
            statusLabel.innerText = "状态：管理员已就绪 🟢";
            statusLabel.style.color = "#10b981";
            authBtn.className = "ctrl-btn danger";
            authBtn.innerText = "🚪 退出登录";
          } else {
            statusLabel.innerText = "状态：访客受限模式 🔒";
            statusLabel.style.color = "#7f8c8d";
            authBtn.className = "ctrl-btn";
            authBtn.innerText = "🔑 管理员登录";
          }
        }

        window.handleAuthBtnClick = function() {
          if (isAdminLoggedIn()) {
            if (confirm("确定要退出管理员模式吗？退出后访问加锁文件将需要重新输入密码。")) {
              sessionStorage.removeItem(SESSION_AUTH_KEY);
              updateAuthUI();
              drawList();
              alert("已成功退出登录，进入安全防护状态。");
            }
          } else {
            currentAuthAction = (authKey) => {
              if (authKey === SEC_KEY) {
                sessionStorage.setItem(SESSION_AUTH_KEY, "true");
                updateAuthUI();
                drawList();
                alert("🎉 欢迎回来，管理员！所有加锁文件已开放直接访问。");
              } else {
                alert("🚨 密码错误，无法验证身份！");
              }
            };
            openGate("管理员身份认证");
          }
        };

        function getNormalizedKey(name) {
          let p = (currentPath + name).replace(/\/+/g, '/');
          return p.startsWith('/') ? p : '/' + p;
        }

        function formatBytes(bytes) {
          if (!bytes || bytes === 0) return '-';
          const k = 1024;
          const sizes = ['B', 'KB', 'MB', 'GB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        function getWebDAVPath(subPath) {
          let p = (currentPath + (subPath || '')).replace(/\/+/g, '/');
          if (!p.startsWith('/')) p = '/' + p;
          return '/webdav' + p;
        }

        function renderBreadcrumbs() {
          const box = document.getElementById('breadcrumb-box');
          box.innerHTML = '';
          const parts = currentPath.split('/').filter(Boolean);
          
          let rootSpan = document.createElement('span');
          rootSpan.className = 'crumb-item';
          rootSpan.innerText = '根目录';
          rootSpan.onclick = () => navigateTo('/');
          box.appendChild(rootSpan);

          let builtPath = '/';
          parts.forEach((part) => {
            builtPath += part + '/';
            const thisPath = builtPath;
            
            let sep = document.createElement('span');
            sep.className = 'crumb-sep';
            sep.innerText = '/';
            box.appendChild(sep);

            let item = document.createElement('span');
            item.className = 'crumb-item';
            item.innerText = part;
            item.onclick = () => navigateTo(thisPath);
            box.appendChild(item);
          });
        }

        window.navigateTo = function(targetPath) {
          currentPath = targetPath.replace(/\/+/g, '/');
          if (!currentPath.endsWith('/')) currentPath += '/';
          fetchDirectory();
        };

        async function fetchDirectory() {
          renderBreadcrumbs();
          updateAuthUI();
          await fetchCloudLocks();

          const targetUrl = getWebDAVPath();
          try {
            const res = await fetch(targetUrl, {
              method: 'PROPFIND',
              headers: { 'Depth': '1' }
            });
            if (!res.ok) throw new Error('WebDAV HTTP: ' + res.status);

            const xmlText = await res.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const responses = Array.from(xmlDoc.getElementsByTagNameNS("*", "response"));

            files = [];
            const normalizedCurUri = targetUrl.replace(/\/$/, '');

            for (let i = 0; i < responses.length; i++) {
              const href = responses[i].getElementsByTagNameNS("*", "href")[0]?.textContent || '';
              const cleanHref = href.replace(/\/$/, '');
              
              if (cleanHref.endsWith(normalizedCurUri) || cleanHref === normalizedCurUri) continue;

              const resType = responses[i].getElementsByTagNameNS("*", "resourcetype")[0];
              const isCollection = resType && resType.getElementsByTagNameNS("*", "collection").length > 0;
              
              const rawName = cleanHref.split('/').pop();
              const name = decodeURIComponent(rawName);

              if (name === '_$flaredrive$' || name === '.titan_locks.json' || !name) continue;

              const sizeTag = responses[i].getElementsByTagNameNS("*", "getcontentlength")[0];
              const sizeBytes = sizeTag ? parseInt(sizeTag.textContent || '0') : 0;
              
              const ext = name.split('.').pop().toLowerCase();
              let fType = isCollection ? 'folder' : 'doc';
              if (!isCollection) {
                if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) fType = 'image';
                else if (['mp4', 'webm', 'mov', 'mkv'].includes(ext)) fType = 'video';
              }

              files.push({
                name: name,
                isFolder: isCollection,
                size: isCollection ? '-' : formatBytes(sizeBytes),
                type: fType,
                url: href.startsWith('http') ? href : (location.origin + href)
              });
            }

            files.sort((a, b) => {
              if (a.isFolder === b.isFolder) return a.name.localeCompare(b.name);
              return a.isFolder ? -1 : 1;
            });

            drawList();
          } catch (e) {
            console.error(e);
            document.getElementById('files-box').innerHTML = 
              `<tr><td colspan="4" style="text-align:center;color:#ef4444;padding:25px;">目录读取失败，请检查网络或后端状态。</td></tr>`;
          }
        }
        function drawList() {
          const box = document.getElementById('files-box');
          if (!box) return;
          box.innerHTML = '';

          if (currentPath !== '/') {
            const upTr = document.createElement('tr');
            upTr.className = 'file-row';
            upTr.innerHTML = `
              <td colspan="4">
                <span class="dir-link" onclick="navigateUp()">📁 .. [返回上一层目录]</span>
              </td>
            `;
            box.appendChild(upTr);
          }

          if (files.length === 0) {
            let emptyTr = document.createElement('tr');
            emptyTr.innerHTML = `<td colspan="4" style="text-align:center;color:#7f8c8d;padding:30px;">当前文件夹为空</td>`;
            box.appendChild(emptyTr);
            return;
          }

          files.forEach(f => {
            const fileKey = getNormalizedKey(f.name);
            const isLocked = !!cloudLocks[fileKey];

            const tr = document.createElement('tr');
            tr.className = 'file-row';

            let icon = '📄';
            if (f.isFolder) icon = '📁';
            else if (f.type === 'video') icon = '🎬';
            else if (f.type === 'image') icon = '🖼️';

            const nameHtml = f.isFolder 
              ? `<span class="dir-link" onclick="navigateTo('${(currentPath + f.name + '/').replace(/\/+/g, '/')}')">${icon} ${f.name}</span>`
              : `${icon} ${f.name}`;

            tr.innerHTML = `
              <td>${nameHtml}</td>
              <td style="color:#7f8c8d">${f.size}</td>
              <td style="text-align:center">
                <button class="lock-btn" onclick="window.onLockClick('${fileKey}')">
                  <span>${isLocked ? '🔴' : '🔓'}</span>
                </button>
              </td>
              <td style="text-align:right">
                ${!f.isFolder ? `<button class="action-btn" onclick="window.onPreviewClick('${f.name}')">预览</button>` : ''}
                ${!f.isFolder ? `<button class="action-btn" onclick="window.onDownloadClick('${f.name}')">下载</button>` : ''}
                <button class="action-btn" style="background:#2a334a !important;" onclick="window.onMoveClick('${f.name}')">移动</button>
                <button class="delete-btn" onclick="window.onDeleteClick('${f.name}', ${f.isFolder})">删除 🗑️</button>
              </td>
            `;
            box.appendChild(tr);
          });
        }

        window.navigateUp = function() {
          const parts = currentPath.split('/').filter(Boolean);
          parts.pop();
          navigateTo('/' + (parts.length > 0 ? parts.join('/') + '/' : ''));
        };

        window.onLockClick = async function(fileKey) {
          if (!cloudLocks[fileKey]) {
            cloudLocks[fileKey] = true;
            drawList();
            await syncCloudLocks();
            alert("🔒 已锁定！加密状态已同步至云端，所有设备查看均显示为红点 🔴。");
          } else {
            if (isAdminLoggedIn()) {
              delete cloudLocks[fileKey];
              drawList();
              await syncCloudLocks();
              alert("🔓 已解除锁定，文件恢复公开状态。");
            } else {
              currentAuthAction = async (authKey) => {
                if (authKey === SEC_KEY) {
                  delete cloudLocks[fileKey];
                  drawList();
                  await syncCloudLocks();
                  alert("🔓 密码验证成功，已解除锁定并同步云端！");
                } else {
                  alert("🚨 密码错误，无法解锁！");
                }
              };
              openGate("🔓 解除锁定验证");
            }
          }
        };

        window.onPreviewClick = function(name) {
          const fileKey = getNormalizedKey(name);
          const f = files.find(item => item.name === name);
          if (!f) return;

          const execute = () => {
            const area = document.getElementById('v-area');
            document.getElementById('v-title').innerText = f.name;
            if (f.type === 'image') area.innerHTML = `<img src="${f.url}">`;
            else if (f.type === 'video') area.innerHTML = `<video src="${f.url}" controls autoplay></video>`;
            else area.innerHTML = `<p style="color:#7f8c8d;padding:20px;">该格式不支持在线预览，请直接下载。</p>`;
            document.getElementById('view-modal').classList.add('active');
          };

          if (cloudLocks[fileKey] && !isAdminLoggedIn()) {
            currentAuthAction = (authKey) => {
              if (authKey === SEC_KEY) execute();
              else alert("🚨 密码错误，禁止预览！");
            };
            openGate("👁️ 预览受限：请输入管理密码");
          } else {
            execute();
          }
        };

        window.onDownloadClick = function(name) {
          const fileKey = getNormalizedKey(name);
          const f = files.find(item => item.name === name);
          if (!f) return;

          const execute = () => {
            const a = document.createElement('a');
            a.href = f.url;
            a.download = f.name;
            a.click();
          };

          if (cloudLocks[fileKey] && !isAdminLoggedIn()) {
            currentAuthAction = (authKey) => {
              if (authKey === SEC_KEY) execute();
              else alert("🚨 密码错误，禁止下载！");
            };
            openGate("📥 下载受限：请输入管理密码");
          } else {
            execute();
          }
        };

        window.onDeleteClick = function(name, isFolder) {
          const fileKey = getNormalizedKey(name);
          const execute = async () => {
            const tip = isFolder ? `确定删除文件夹【${name}】及其内部所有内容吗？` : `确定彻底删除文件【${name}】吗？`;
            if (!confirm(tip)) return;
            try {
              const res = await fetch(getWebDAVPath(encodeURIComponent(name)), { method: 'DELETE' });
              if (res.ok || res.status === 204) {
                if (cloudLocks[fileKey]) {
                  delete cloudLocks[fileKey];
                  await syncCloudLocks();
                }
                fetchDirectory();
              } else {
                alert('删除失败，状态码: ' + res.status);
              }
            } catch(e) {
              alert('网络异常，删除失败');
            }
          };

          if (cloudLocks[fileKey] && !isAdminLoggedIn()) {
            currentAuthAction = (authKey) => {
              if (authKey === SEC_KEY) execute();
              else alert("🚨 密码错误，禁止删除！");
            };
            openGate("🗑️ 危险操作：删除加锁项目验证");
          } else {
            execute();
          }
        };

        window.openNewFolderModal = function() {
          document.getElementById('new-folder-name').value = '';
          document.getElementById('folder-modal').classList.add('active');
        };

        window.submitNewFolder = async function() {
          const folderName = document.getElementById('new-folder-name').value.trim();
          if (!folderName) return alert('文件夹名称不能为空');
          closeBox('folder-modal');

          const destUrl = getWebDAVPath(encodeURIComponent(folderName) + '/');
          try {
            const res = await fetch(destUrl, { method: 'MKCOL' });
            if (res.ok || res.status === 201) {
              fetchDirectory();
            } else {
              alert('新建文件夹失败，状态码: ' + res.status);
            }
          } catch(e) {
            alert('网络异常，无法创建文件夹');
          }
        };

        window.onMoveClick = function(name) {
          movingTargetItem = name;
          document.getElementById('move-dest-input').value = currentPath;
          document.getElementById('move-modal').classList.add('active');
        };

        window.submitMove = async function() {
          let destDir = document.getElementById('move-dest-input').value.trim();
          if (!destDir.startsWith('/')) destDir = '/' + destDir;
          if (!destDir.endsWith('/')) destDir += '/';
          
          closeBox('move-modal');
          const sourceUrl = getWebDAVPath(encodeURIComponent(movingTargetItem));
          const targetUrl = ('/webdav' + destDir + encodeURIComponent(movingTargetItem)).replace(/\/+/g, '/');

          try {
            const res = await fetch(sourceUrl, {
              method: 'MOVE',
              headers: {
                'Destination': targetUrl,
                'Overwrite': 'F'
              }
            });
            if (res.ok || res.status === 201 || res.status === 204) {
              const oldKey = getNormalizedKey(movingTargetItem);
              if (cloudLocks[oldKey]) {
                delete cloudLocks[oldKey];
                const newKey = (destDir + movingTargetItem).replace(/\/+/g, '/');
                cloudLocks[newKey] = true;
                await syncCloudLocks();
              }
              fetchDirectory();
            } else {
              alert('移动失败，错误码: ' + res.status);
            }
          } catch(e) {
            alert('网络异常，未能移动');
          }
        };

        async function uploadSingleFile(file, remoteSubPath) {
          const destUrl = getWebDAVPath(remoteSubPath);
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("PUT", destUrl);
            xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
            xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(xhr.status);
            xhr.onerror = () => reject('NetErr');
            xhr.send(file);
          });
        }

        window.handleFilesUpload = async function(fileList) {
          if (!fileList || fileList.length === 0) return;
          const panel = document.getElementById('upload-progress-panel');
          const bar = document.getElementById('upload-bar-fill');
          panel.style.display = 'block';

          for (let i = 0; i < fileList.length; i++) {
            const file = fileList[i];
            document.getElementById('upload-filename-tag').innerText = `上传 (${i+1}/${fileList.length}): ${file.name}`;
            const pct = Math.round(((i + 1) / fileList.length) * 100);
            bar.style.width = pct + '%';
            document.getElementById('upload-percent-tag').innerText = pct + '%';
            try {
              await uploadSingleFile(file, encodeURIComponent(file.name));
            } catch (err) {
              console.error(err);
            }
          }

          setTimeout(() => {
            panel.style.display = 'none';
            bar.style.width = '0%';
            fetchDirectory();
          }, 300);
        };

        window.handleFolderUpload = async function(fileList) {
          if (!fileList || fileList.length === 0) return;
          const panel = document.getElementById('upload-progress-panel');
          const bar = document.getElementById('upload-bar-fill');
          panel.style.display = 'block';

          for (let i = 0; i < fileList.length; i++) {
            const file = fileList[i];
            const relPath = file.webkitRelativePath || file.name;
            const encodedRelPath = relPath.split('/').map(encodeURIComponent).join('/');
            
            document.getElementById('upload-filename-tag').innerText = `同步目录 (${i+1}/${fileList.length}): ${file.name}`;
            const pct = Math.round(((i + 1) / fileList.length) * 100);
            bar.style.width = pct + '%';
            document.getElementById('upload-percent-tag').innerText = pct + '%';

            try {
              await uploadSingleFile(file, encodedRelPath);
            } catch (err) {
              console.error(err);
            }
          }

          setTimeout(() => {
            panel.style.display = 'none';
            bar.style.width = '0%';
            fetchDirectory();
          }, 400);
        };

        function openGate(title) {
          document.getElementById('m-title').innerText = title;
          document.getElementById('m-pwd').value = '';
          document.getElementById('lock-modal').classList.add('active');
        }

        window.closeBox = function(id) {
          document.getElementById(id).classList.remove('active');
        };

        document.getElementById('m-ok').onclick = () => {
          const pwd = document.getElementById('m-pwd').value;
          closeBox('lock-modal');
          if (currentAuthAction) currentAuthAction(btoa(pwd));
        };

        fetchDirectory();
      })();
    </script>
  </body>
</html>
