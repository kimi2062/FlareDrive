<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Titan Drive</title>
    
    <style>
      /* 全局高级暗黑极简重塑 */
      body { background-color: #0b0c10 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; color: #f1f2f6 !important; margin: 0; min-height: 100vh; }
      #root-override { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
      .header { display: flex; justify-content: space-between; border-bottom: 1px solid #222533; padding-bottom: 15px; margin-bottom: 25px; align-items: center; }
      .logo { font-size: 22px; font-weight: 700; color: #3b82f6; }
      
      /* 🚀 极速直传舱样式 */
      .upload-panel { background: #14161f; border: 2px dashed #222533; border-radius: 12px; padding: 25px; text-align: center; margin-bottom: 25px; cursor: pointer; transition: 0.2s; display: block; }
      .upload-panel:hover { border-color: #3b82f6; background: #171a26; }
      .progress-container { margin-top: 15px; background: #0b0c10; padding: 12px; border-radius: 8px; display: none; text-align: left; border: 1px solid #222533; }
      .progress-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
      .speed-tag { color: #10b981; font-weight: 600; }
      .progress-bar-bg { width: 100%; height: 6px; background: #222533; border-radius: 3px; overflow: hidden; }
      .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(to right, #3b82f6, #10b981); transition: width 0.1s linear; }
      
      /* 📁 扁平化文件列表布局 */
      .file-table { width: 100%; border-collapse: collapse; background: #14161f; border-radius: 12px; overflow: hidden; }
      .file-table th { background: #1c1e29; padding: 14px 20px; text-align: left; font-size: 13px; color: #7f8c8d; }
      .file-table td { padding: 16px 20px; border-bottom: 1px solid #222533; font-size: 14px; }
      .file-row:hover { background: rgba(255, 255, 255, 0.02); }
      
      /* 一键加锁图标与操作 */
      .lock-btn { background: none !important; border: none !important; cursor: pointer; font-size: 18px; padding: 5px; }
      .action-btn { background: #222533 !important; color: #fff !important; border: none !important; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; font-size: 13px; }
      .action-btn:hover { background: #3b82f6 !important; }
      .delete-btn { background: #222533 !important; color: #ef4444 !important; border: none !important; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; font-size: 13px; }
      .delete-btn:hover { background: #ef4444 !important; color: #fff !important; }
      
      /* 🔐 拦截模态弹窗与大图预览 */
      .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; transition: 0.2s; }
      .modal.active { opacity: 1; pointer-events: auto; }
      .modal-box { background: #14161f; border: 1px solid #222533; border-radius: 12px; padding: 25px; width: 90%; max-width: 450px; }
      .modal-box.large { max-width: 800px; }
      .m-input { width: 100%; background: #0b0c10; border: 1px solid #222533; color: #fff; padding: 10px; border-radius: 6px; margin: 15px 0; box-sizing: border-box; }
      .preview-area img, .preview-area video { max-width: 100%; max-height: 65vh; border-radius: 6px; }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root-override">
      <div class="header">
        <div class="logo">📂 Titan Drive</div>
        <div style="font-size:13px; color:#7f8c8d">已连通 Cloudflare 原生接口</div>
      </div>
      
      <!-- 极速直传舱 -->
      <label class="upload-panel" for="hidden-file-input">
        <input 
          type="file" 
          id="hidden-file-input" 
          style="display:none;" 
          onclick="event.stopPropagation()" 
          onchange="handleFlareUpload(this.files); this.value='';" 
        />
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 5px;">⚡ 极速直传至 Cloudflare 存储</div>
        <div style="font-size: 13px; color: #7f8c8d;">点击或拖拽文件到此区域，调用真实后端通道上传</div>
        
        <div id="upload-progress-panel" class="progress-container" onclick="event.stopPropagation()">
          <div class="progress-meta">
            <span id="upload-filename-tag">准备传输...</span>
            <div>
              <span id="upload-percent-tag">0%</span>
              <span class="speed-tag" id="upload-speed-tag" style="margin-left:12px;">0 MB/s</span>
            </div>
          </div>
          <div class="progress-bar-bg"><div id="upload-bar-fill" class="progress-bar-fill"></div></div>
        </div>
      </label>

      <!-- 扁平化主体列表表格 -->
      <table class="file-table">
        <thead>
          <tr>
            <th>文件名</th>
            <th>大小</th>
            <th style="width: 80px; text-align:center;">状态</th>
            <th style="width: 240px; text-align:right;">操作</th>
          </tr>
        </thead>
        <tbody id="files-box">
          <tr><td colspan="4" style="text-align:center;color:#7f8c8d;padding:20px;">正在连接 Cloudflare 后端接口拉取文件...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 鉴权拦截弹窗 -->
    <div id="lock-modal" class="modal">
      <div class="modal-box">
        <h3 id="m-title" style="margin:0;">权限安全拦截</h3>
        <input type="password" id="m-pwd" class="m-input" placeholder="请输入访问密钥..." />
        <div style="text-align:right;">
          <button class="action-btn" onclick="closeBox()">取消</button>
          <button class="action-btn" style="background:#3b82f6 !important" id="m-ok">核验密码</button>
        </div>
      </div>
    </div>

    <!-- 在线预览弹窗 -->
    <div id="view-modal" class="modal" onclick="closeView()">
      <div class="modal-box large" onclick="event.stopPropagation()">
        <h3 id="v-title" style="margin:0 0 15px 0;">文件在线预览</h3>
        <div class="preview-area" id="v-area" style="text-align:center;"></div>
      </div>
    </div>

    <div id="root" style="display:none !important;"></div>

    <script>
      (function() {
        const SEC_KEY = "aWtpbWk1MjA="; // 默认指令暗码: ikimi520
        let locks = JSON.parse(localStorage.getItem('hd_locks') || '{}');
        let files = [];
        let currentAuthAction = null;

        // 格式化文件大小
        function formatBytes(bytes) {
          if (!bytes || bytes === 0) return '0 B';
          const k = 1024;
          const sizes = ['B', 'KB', 'MB', 'GB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        // 1. 调用 FlareDrive 标准列表接口拉取真实文件
        async function fetchChildren() {
          try {
            // FlareDrive 原生接口：GET /api/children
            const res = await fetch('/api/children');
            if (!res.ok) throw new Error('FlareDrive 响应失败: ' + res.status);
            const data = await res.json();
            
            // 兼容 FlareDrive 的返回值 (data.value 或直接数组)
            const list = data.value || data || [];
            files = list.map(item => {
              const name = item.name || item.key || '未命名文件';
              const ext = name.split('.').pop().toLowerCase();
              let fType = 'doc';
              if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) fType = 'image';
              else if (['mp4', 'webm', 'mov', 'mkv'].includes(ext)) fType = 'video';
              
              // 兼容原生下载/预览直链
              const fileUrl = item.url || ('/api/raw/' + encodeURIComponent(name));

              return {
                id: name,
                name: name,
                size: formatBytes(item.size),
                type: fType,
                url: fileUrl
              };
            });

            drawList();
          } catch (e) {
            console.error(e);
            document.getElementById('files-box').innerHTML = 
              `<tr><td colspan="4" style="text-align:center;color:#ef4444;padding:25px;">无法读取后端 /api/children 接口，请确认 Worker 是否在线。</td></tr>`;
          }
        }

        // 2. 渲染文件列表
        function drawList() {
          const box = document.getElementById('files-box');
          if (!box) return;
          if (files.length === 0) {
            box.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#7f8c8d;padding:30px;">存储桶内暂无文件，点击上方上传舱开始上传</td></tr>';
            return;
          }
          box.innerHTML = '';
          files.forEach(f => {
            const hasLock = !!locks[f.id];
            const tr = document.createElement('tr');
            tr.className = 'file-row';
            tr.innerHTML = `
              <td>${f.type === 'video' ? '🎬' : (f.type === 'image' ? '🖼️' : '📄')} ${f.name}</td>
              <td style="color:#7f8c8d">${f.size}</td>
              <td style="text-align:center">
                <button class="lock-btn" onclick="window.onLockClick('${f.id}')">
                  <span>${hasLock ? '🔴' : '🔓'}</span>
                </button>
              </td>
              <td style="text-align:right">
                <button class="action-btn" onclick="window.onPreviewClick('${f.id}')">预览</button>
                <button class="action-btn" onclick="window.onDownloadClick('${f.id}')">下载</button>
                <button class="delete-btn" onclick="window.onDeleteClick('${f.id}')">删除 🗑️</button>
              </td>
            `;
            box.appendChild(tr);
          });
        }

        // 3. 真实对接 FlareDrive 上传通道（PUT /api/write/:filename）
        window.handleFlareUpload = function(uploadedFiles) {
          if (!uploadedFiles || uploadedFiles.length === 0) return;
          const file = uploadedFiles[0];
          const panel = document.getElementById('upload-progress-panel');
          const bar = document.getElementById('upload-bar-fill');
          const nameTag = document.getElementById('upload-filename-tag');
          const pctTag = document.getElementById('upload-percent-tag');
          const speedTag = document.getElementById('upload-speed-tag');

          panel.style.display = 'block';
          nameTag.innerText = `正在直传: ${file.name}`;

          const xhr = new XMLHttpRequest();
          let startTime = Date.now();
          let loadedPrev = 0;

          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const now = Date.now();
              const duration = (now - startTime) / 1000 || 0.1;
              const speed = (((e.loaded - loadedPrev) / duration) / (1024 * 1024)).toFixed(2);
              const pct = Math.round((e.loaded / e.total) * 100);

              pctTag.innerText = `${pct}%`;
              speedTag.innerText = `${speed} MB/s`;
              bar.style.width = `${pct}%`;

              startTime = now;
              loadedPrev = e.loaded;
            }
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              setTimeout(() => {
                alert('🎉 文件成功上载至 Cloudflare R2！');
                panel.style.display = 'none';
                bar.style.width = '0%';
                fetchChildren(); // 重新拉取真实列表
              }, 300);
            } else {
              alert('上载失败：' + xhr.statusText);
              panel.style.display = 'none';
            }
          };

          xhr.onerror = () => {
            alert('网络异常，无法连接 Cloudflare 节点');
            panel.style.display = 'none';
          };

          // FlareDrive 标准写接口
          xhr.open("PUT", `/api/write/${encodeURIComponent(file.name)}`);
          xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
          xhr.send(file);
        };

        // 4. 一键加锁 / 解锁（本地加密状态安全持久化）
        window.onLockClick = function(id) {
          if (!locks[id]) {
            locks[id] = true;
            localStorage.setItem('hd_locks', JSON.stringify(locks));
            alert('🔒 文件已一键加锁，红点 🔴 拦截模式已激活');
            drawList();
          } else {
            currentAuthAction = (authKey) => {
              if (authKey === SEC_KEY) {
                delete locks[id];
                localStorage.setItem('hd_locks', JSON.stringify(locks));
                alert('🔓 解锁成功，文件恢复公开状态');
                drawList();
              } else {
                alert('🚨 密码不正确，拒绝解锁！');
              }
            };
            openGate('🔓 解除文件加密验证');
          }
        };

        // 5. 预览
        window.onPreviewClick = function(id) {
          const f = files.find(item => item.id === id);
          if (!f) return;
          const execute = () => {
            const area = document.getElementById('v-area');
            document.getElementById('v-title').innerText = f.name;
            if (f.type === 'image') area.innerHTML = `<img src="${f.url}">`;
            else if (f.type === 'video') area.innerHTML = `<video src="${f.url}" controls autoplay></video>`;
            else area.innerHTML = `<p style="color:#7f8c8d;padding:20px;">该格式不支持在线预览，请直接下载查看。</p>`;
            document.getElementById('view-modal').classList.add('active');
          };

          if (locks[id]) {
            currentAuthAction = (authKey) => {
              if (authKey === SEC_KEY) execute();
              else alert('🚨 密码错误，拦截预览！');
            };
            openGate('👁️ 预览受限：请输入安全密码');
          } else {
            execute();
          }
        };

        // 6. 下载
        window.onDownloadClick = function(id) {
          const f = files.find(item => item.id === id);
          if (!f) return;
          const execute = () => {
            const a = document.createElement('a');
            a.href = f.url;
            a.download = f.name;
            a.click();
          };

          if (locks[id]) {
            currentAuthAction = (authKey) => {
              if (authKey === SEC_KEY) execute();
              else alert('🚨 密码错误，拦截下载！');
            };
            openGate('📥 下载受限：请输入安全密码');
          } else {
            execute();
          }
        };

        // 7. 真实对接 FlareDrive 删除通道（DELETE /api/children/:filename）
        window.onDeleteClick = function(id) {
          const f = files.find(item => item.id === id);
          if (!f) return;
          
          const execute = async () => {
            if (!confirm(`确定彻底删除 Cloudflare 中的文件【${f.name}】吗？`)) return;
            try {
              const res = await fetch(`/api/children/${encodeURIComponent(f.name)}`, {
                method: 'DELETE'
              });
              if (res.ok) {
                alert('文件已从 Cloudflare 安全销毁');
                if (locks[id]) {
                  delete locks[id];
                  localStorage.setItem('hd_locks', JSON.stringify(locks));
                }
                fetchChildren();
              } else {
                alert('删除失败，状态码: ' + res.status);
              }
            } catch (e) {
              alert('请求失败，请稍后重试');
            }
          };

          if (locks[id]) {
            currentAuthAction = (authKey) => {
              if (authKey === SEC_KEY) execute();
              else alert('🚨 密码错误，无法执行删除！');
            };
            openGate('🗑️ 危险操作：删除加锁文件验证');
          } else {
            execute();
          }
        };

        // 弹窗控制
        function openGate(title) {
          document.getElementById('m-title').innerText = title;
          document.getElementById('m-pwd').value = '';
          document.getElementById('lock-modal').classList.add('active');
        }

        window.closeBox = function() { document.getElementById('lock-modal').classList.remove('active'); };
        window.closeView = function() { document.getElementById('view-modal').classList.remove('active'); };

        document.getElementById('m-ok').onclick = () => {
          const pwd = document.getElementById('m-pwd').value;
          closeBox();
          if (currentAuthAction) currentAuthAction(btoa(pwd));
        };

        // 启动时自动同步后端真实文件
        fetchChildren();
      })();
    </script>
  </body>
</html>
